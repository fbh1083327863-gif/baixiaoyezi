<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>白给小叶子助手 - 淘客自动发微博助手</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#faf7f2;color:#333;line-height:1.8}
.wrap{max-width:720px;margin:0 auto;padding:60px 24px;text-align:center}
.logo{width:96px;height:96px;margin:0 auto 24px;border-radius:24px;background:linear-gradient(135deg,#ff6a00,#ff9a3d);display:flex;align-items:center;justify-content:center;font-size:52px}
h1{font-size:32px;margin-bottom:8px}
.sub{color:#ff6a00;font-size:18px;margin-bottom:32px}
.desc{background:#fff;border-radius:16px;padding:32px;margin-bottom:24px;text-align:left;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.desc h2{font-size:20px;margin-bottom:12px}
.desc p{color:#666;font-size:15px}
.feats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:24px}
.feat{background:#fff;border-radius:16px;padding:24px 12px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.feat .e{font-size:36px;margin-bottom:8px}
.feat h3{font-size:16px;margin-bottom:6px}
.feat p{font-size:13px;color:#888}
.note{font-size:13px;color:#999;margin-top:32px}
footer{margin-top:48px;font-size:12px;color:#bbb}
@media(max-width:560px){.feats{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<div class="logo">🍂</div>
<h1>白给小叶子助手</h1>
<p class="sub">淘客自动发微博助手</p>
<div class="desc">
<h2>这是什么</h2>
<p>白给小叶子助手是一款个人开发的淘宝客效率工具：每天自动从淘宝联盟挑选高佣金、低券后价的日用好物，智能组装成微博文案（含淘口令与配图），定时自动发布到绑定的微博账号。个人开发者自用工具，不对外提供服务。</p>
</div>
<div class="feats">
<div class="feat"><div class="e">🔍</div><h3>自动选品</h3><p>按佣金率与券后价筛选高性价比好物</p></div>
<div class="feat"><div class="e">✍️</div><h3>智能文案</h3><p>自动组装种草文案、淘口令与配图</p></div>
<div class="feat"><div class="e">⏰</div><h3>定时发布</h3><p>每天定时自动发布到微博账号</p></div>
</div>
<p class="note">本工具通过微博开放平台官方 OAuth 授权，仅在用户本人授权的情况下发布内容，不收集、不存储任何账号密码。</p>
<footer>© 2026 白给小叶子助手 · 个人开发者作品</footer>
</div>
</body>
</html>
